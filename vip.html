<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Member Area</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 30px 20px;
      color: white;
      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(255, 255, 255, 0.22),
          transparent 32%
        ),
        radial-gradient(
          circle at 80% 30%,
          rgba(190, 165, 255, 0.3),
          transparent 35%
        ),
        linear-gradient(
          180deg,
          #d8ccff 0%,
          #a995ff 38%,
          #7765db 72%,
          #5142aa 100%
        );
    }

    .page-wrapper {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 440px;
      min-height: calc(100vh - 60px);
      margin: 0 auto;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }

    .contest-link {
      display: block;
      width: 100%;
      max-width: 390px;
      text-decoration: none;
    }

    .contest-image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(46, 34, 110, 0.24);
    }

    .card {
      width: 100%;
      max-width: 360px;
      padding: 28px 22px;

      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;

      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      box-shadow: 0 18px 45px rgba(61, 45, 145, 0.22);
      text-align: center;
    }

    .divider {
      margin-bottom: 22px;
      font-size: 1.35rem;
      letter-spacing: 8px;
    }

    .divider.bottom {
      margin-top: 22px;
      margin-bottom: 0;
      opacity: 0.75;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px 20px;

      border-radius: 16px;
      background: rgba(121, 103, 255, 0.9);

      color: white;
      text-decoration: none;
      text-align: left;
      font-size: 1.08rem;
      font-weight: 400;

      box-shadow: 0 10px 24px rgba(83, 65, 190, 0.23);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn:hover,
    .btn:focus {
      transform: translateY(-1px);
      background: rgba(135, 120, 255, 0.96);
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.65;
    }

    .stars span {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: white;
    }

    .stars span:nth-child(1) {
      top: 15%;
      left: 8%;
    }

    .stars span:nth-child(2) {
      top: 41%;
      right: 10%;
    }

    .stars span:nth-child(3) {
      top: 66%;
      left: 15%;
    }

    .stars span:nth-child(4) {
      top: 78%;
      right: 18%;
    }

    .stars span:nth-child(5) {
      top: 87%;
      left: 48%;
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 16px;
      }

      .page-wrapper {
        justify-content: flex-start;
        min-height: auto;
      }

      .contest-link {
        max-width: 360px;
      }

      .card {
        max-width: 360px;
      }
    }
  </style>
</head>

<body>

  <div class="stars" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <main class="page-wrapper">

    <a
      class="contest-link"
      href="https://www.manyvids.com/Video/6871097/playing-a-level-from-super-mario-64"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img
        class="contest-image"
        src="InShot_20260715_042340403.jpg"
        alt="ManyVids Gaming Video of the Month finalist"
      >
    </a>

    <section class="card">

      <div class="divider">✦ ✧ ✦</div>

      <div class="buttons">

        <a
          class="btn"
          href="https://fansly.com/nek0_wave"
          target="_blank"
          rel="noopener noreferrer"
        >
          Continue
        </a>

        <a
          class="btn"
          href="https://t.me/nek0s_channel"
          target="_blank"
          rel="noopener noreferrer"
        >
          Telegram Channel
        </a>

        <a
          class="btn"
          href="https://www.instagram.com/nek0_wave/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Instagram
        </a>

        <a class="btn" href="/">
          Back to Home
        </a>

      </div>

      <div class="divider bottom">✦ ✧ ✦</div>

    </section>

  </main>

</body>
</html>
