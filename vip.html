<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>More Content</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      color: white;
      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 18% 12%,
          rgba(255, 255, 255, 0.24),
          transparent 28%
        ),
        radial-gradient(
          circle at 80% 24%,
          rgba(191, 171, 255, 0.32),
          transparent 34%
        ),
        radial-gradient(
          circle at 50% 58%,
          rgba(119, 95, 231, 0.22),
          transparent 42%
        ),
        linear-gradient(
          180deg,
          #d9ceff 0%,
          #b3a1ff 32%,
          #8170e8 67%,
          #5043ad 100%
        );
    }

    .nebula {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 25% 25%,
          rgba(255, 255, 255, 0.12),
          transparent 28%
        ),
        radial-gradient(
          circle at 78% 38%,
          rgba(222, 210, 255, 0.16),
          transparent 30%
        );

      filter: blur(8px);
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .stars span {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 7px rgba(255, 255, 255, 0.7);
    }

    .stars span:nth-child(1) {
      top: 13%;
      left: 10%;
    }

    .stars span:nth-child(2) {
      top: 23%;
      right: 12%;
    }

    .stars span:nth-child(3) {
      top: 39%;
      left: 18%;
    }

    .stars span:nth-child(4) {
      top: 48%;
      right: 8%;
    }

    .stars span:nth-child(5) {
      top: 62%;
      left: 7%;
    }

    .stars span:nth-child(6) {
      top: 70%;
      right: 17%;
    }

    .stars span:nth-child(7) {
      top: 81%;
      left: 30%;
    }

    .stars span:nth-child(8) {
      top: 89%;
      right: 31%;
    }

    .city {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 220px;
      z-index: 1;
      pointer-events: none;
      opacity: 0.22;

      background:
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 10px,
          rgba(255, 255, 255, 0.16) 11px,
          transparent 13px
        ),
        linear-gradient(
          180deg,
          transparent 0%,
          rgba(46, 32, 127, 0.2) 100%
        );

      mask-image: linear-gradient(
        to bottom,
        transparent,
        black 30%
      );

      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent,
        black 30%
      );
    }

    .page {
      position: relative;
      z-index: 3;

      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 34px 20px 90px;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .contest-link {
      display: block;
      width: 100%;
      max-width: 520px;
      margin-bottom: 36px;
      text-decoration: none;
    }

    .contest-image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 22px;

      box-shadow:
        0 16px 40px rgba(64, 45, 155, 0.25),
        0 0 24px rgba(255, 169, 220, 0.18);
    }

    .sparkles {
      margin-bottom: 28px;
      font-size: 1.65rem;
      letter-spacing: 14px;
      text-align: center;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 100px;
      padding: 22px 28px;

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 23px;

      background:
        linear-gradient(
          135deg,
          rgba(127, 106, 255, 0.96),
          rgba(118, 98, 245, 0.93)
        );

      color: white;
      text-decoration: none;
      text-align: center;
      font-size: clamp(1.35rem, 4.8vw, 1.8rem);
      font-weight: 500;

      box-shadow:
        0 12px 28px rgba(76, 55, 180, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);

      transition:
        transform 0.18s ease,
        filter 0.18s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.06);
      outline: none;
    }

    .bottom-sparkles {
      margin-top: 32px;
      font-size: 1.2rem;
      letter-spacing: 10px;
      opacity: 0.78;
    }

    @media (max-width: 600px) {
      .page {
        padding: 26px 18px 80px;
      }

      .contest-link {
        margin-bottom: 30px;
      }

      .contest-image {
        border-radius: 16px;
      }

      .links {
        gap: 18px;
      }

      .btn {
        min-height: 96px;
        border-radius: 21px;
      }
    }
  </style>
</head>

<body>

  <div class="nebula"></div>

  <div class="stars" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="city" aria-hidden="true"></div>

  <main class="page">

    <a
      class="contest-link"
      href="https://www.manyvids.com/Video/6871097/playing-a-level-from-super-mario-64"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img
        class="contest-image"
        src="InShot_20260715_042340403.jpg"
        alt="ManyVids Gaming Video of the Month finalist. Tap to help me win."
      >
    </a>

    <div class="sparkles" aria-hidden="true">
      ✦ ✧ ✦
    </div>

    <div class="links">

      <a
        class="btn"
        href="https://fansly.com/nek0_wave"
        target="_blank"
        rel="noopener noreferrer"
      >
        Continue
      </a>

      <a
        class="btn"
        href="https://t.me/nek0s_channel"
        target="_blank"
        rel="noopener noreferrer"
      >
        Telegram Channel
      </a>

      <a
        class="btn"
        href="https://www.instagram.com/nek0_wave/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>

      <a
        class="btn"
        href="/"
      >
        Back to Home
      </a>

    </div>

    <div class="bottom-sparkles" aria-hidden="true">
      ✦ ✧ ✦
    </div>

  </main>

</body>
</html>
