<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Links</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
  color: #fff;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(155, 85, 255, 0.38), transparent 40%),
    radial-gradient(ellipse at 80% 35%, rgba(75, 35, 160, 0.48), transparent 42%),
    radial-gradient(ellipse at 50% 85%, rgba(35, 15, 95, 0.75), transparent 48%),
    linear-gradient(180deg, #100822 0%, #1a0d35 48%, #090516 100%);
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 15% 18%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 75% 12%, #fff, transparent),
    radial-gradient(2px 2px at 42% 35%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 88% 55%, #fff, transparent),
    radial-gradient(2px 2px at 24% 70%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 63% 80%, #fff, transparent),
    radial-gradient(2px 2px at 9% 90%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 94% 30%, #fff, transparent);
  background-size: 250px 250px;
  animation: twinkle 5s ease-in-out infinite alternate;
  opacity: 0.8;
  z-index: 0;
}

@keyframes twinkle {
  from { opacity: 0.45; }
  to { opacity: 0.95; }
}

.page {
  position: relative;
  z-index: 1;
  width: 100%;
  min-height: 100vh;
  padding: 38px 18px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.profile {
  width: 128px;
  height: 128px;
  border-radius: 50%;
  position: relative;
  margin-bottom: 16px;
  border: 0.75px solid rgba(255, 255, 255, 0.85);
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), transparent 8%),
    radial-gradient(circle at 65% 70%, rgba(255,190,255,0.9), transparent 12%),
    radial-gradient(circle at 50% 45%, #d8b5ff 0%, #9e68e8 28%, #5632a0 62%, #20103e 100%);
  box-shadow:
    0 0 15px rgba(210, 160, 255, 0.65),
    0 0 35px rgba(153, 89, 255, 0.35),
    inset 0 0 18px rgba(255, 255, 255, 0.18);
}

.profile::before {
  content: "☾";
  position: absolute;
  top: 18px;
  left: 41px;
  font-size: 45px;
  color: rgba(255, 255, 255, 0.95);
  text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
  transform: rotate(-18deg);
}

.profile::after {
  content: "✧ ｡˚";
  position: absolute;
  bottom: 22px;
  left: 0;
  right: 0;
  font-size: 17px;
  color: rgba(255, 255, 255, 0.95);
  letter-spacing: 3px;
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
}

.username {
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 15px;
  text-shadow: 0 0 14px rgba(220, 180, 255, 0.7);
}

.sparkles {
  font-size: 0.95rem;
  letter-spacing: 10px;
  padding-left: 10px;
  opacity: 0.78;
}

.top-sparkles {
  margin-bottom: 19px;
}

.links {
  width: 100%;
  max-width: 390px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.link {
  display: block;
  width: 100%;
  padding: 15px 18px;
  border-radius: 16px;
  text-decoration: none;
  color: #fff;
  font-size: 0.98rem;
  font-weight: 600;
  letter-spacing: 0.2px;
  background: linear-gradient(135deg, rgba(206, 167, 255, 0.22), rgba(115, 70, 190, 0.24));
  border: 1px solid rgba(235, 215, 255, 0.38);
  box-shadow:
    0 0 16px rgba(169, 112, 255, 0.13),
    inset 0 0 12px rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(8px);
  transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
}

.link:hover {
  transform: translateY(-2px);
  background: linear-gradient(135deg, rgba(220, 190, 255, 0.32), rgba(140, 90, 220, 0.36));
  box-shadow: 0 0 22px rgba(190, 140, 255, 0.28);
}

.bottom-sparkles {
  margin-top: 14px;
}

.city {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 85px;
  z-index: 0;
  pointer-events: none;
  opacity: 0.5;
  background:
    linear-gradient(to top, rgba(9, 5, 22, 0.98), transparent),
    repeating-linear-gradient(
      90deg,
      transparent 0 12px,
      rgba(165, 115, 255, 0.12) 12px 14px,
      transparent 14px 24px
    );
}

.city::before {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background:
    linear-gradient(to top, rgba(12, 6, 27, 0.95), transparent),
    repeating-linear-gradient(
      90deg,
      #160b2c 0 20px,
      transparent 20px 27px,
      #1e1039 27px 46px,
      transparent 46px 54px
    );
  clip-path: polygon(
    0 40%, 4% 40%, 4% 18%, 9% 18%, 9% 55%, 13% 55%,
    13% 30%, 18% 30%, 18% 5%, 23% 5%, 23% 45%, 28% 45%,
    28% 25%, 33% 25%, 33% 60%, 38% 60%, 38% 15%, 43% 15%,
    43% 42%, 48% 42%, 48% 28%, 53% 28%, 53% 52%, 58% 52%,
    58% 12%, 63% 12%, 63% 43%, 68% 43%, 68% 23%, 73% 23%,
    73% 55%, 78% 55%, 78% 10%, 83% 10%, 83% 40%, 88% 40%,
    88% 22%, 93% 22%, 93% 48%, 100% 48%, 100% 100%, 0 100%
  );
}

@media (max-width: 480px) {
  .page {
    padding-top: 38px;
  }

  .username {
    font-size: 1.8rem;
  }
}
</style>
</head>

<body>
<div class="city"></div>

<main class="page">
  <div class="profile"></div>

  <div class="username">NekoWave</div>

  <div class="sparkles top-sparkles">✧ ⋆ ˚｡⋆</div>

  <div class="links">
    <a class="link" href="https://fansly.com/nek0_wave" target="_blank" rel="noopener noreferrer">Fansly</a>
    <a class="link" href="https://t.me/nek0s_channel" target="_blank" rel="noopener noreferrer">Telegram</a>
    <a class="link" href="https://www.manyvids.com/Activity/nek0wave/1008511608/club" target="_blank" rel="noopener noreferrer">ManyVids</a>
    <a class="link" href="https://www.instagram.com/nek0_wave/" target="_blank" rel="noopener noreferrer">Instagram</a>
    <a class="link" href="/" >Back to Home</a>
  </div>

  <div class="sparkles bottom-sparkles">✧ ⋆ ˚｡⋆</div>
</main>
</body>
</html>
