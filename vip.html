<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIP Access</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      color: white;
      position: relative;

      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.25), transparent 40%),
        radial-gradient(circle at 80% 30%, rgba(180,160,255,0.25), transparent 45%),
        linear-gradient(180deg, #d8ccff 0%, #9f8bff 45%, #4b3fa8 100%);
    }

    /* soft nebula layer */
    .nebula {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.5;
      filter: blur(45px);
    }

    .nebula::before,
    .nebula::after {
      content: "";
      position: absolute;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(255,255,255,0.2), transparent 60%);
      animation: drift 20s ease-in-out infinite;
    }

    .nebula::after {
      right: -25%;
      top: 25%;
      background: radial-gradient(circle, rgba(170,140,255,0.2), transparent 60%);
      animation-duration: 28s;
    }

    @keyframes drift {
      0%,100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(35px) translateX(-25px); }
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;

      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 16px;

      padding: 30px 22px;

      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(0,0,0,0.25);
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 0.95rem;
      opacity: 0.85;
      margin-bottom: 22px;
      line-height: 1.4;
    }

    .btn {
      display: block;
      text-decoration: none;
      color: white;

      background: rgba(120, 105, 255, 0.85);
      padding: 16px;
      border-radius: 12px;
      margin: 12px 0;

      font-size: 1.05rem;
      font-weight: 500;

      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 0 14px rgba(140,120,255,0.25);

      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(1px);
      background: rgba(135, 120, 255, 0.95);
      box-shadow: 0 0 18px rgba(180,160,255,0.35);
    }

    .small {
      margin-top: 12px;
      font-size: 0.75rem;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="nebula"></div>

  <div class="card">

    <h1>VIP Access</h1>

    <p>
      Exclusive content and updates are available below.
    </p>

    <a class="btn" href="https://fansly.com/nek0_wave" target="_blank">
      Enter VIP Content
    </a>

    <a class="btn" href="https://t.me/nek0s_channel" target="_blank">
      Telegram Channel
    </a>

    <a class="btn" href="index.html">
      Back to Home
    </a>

    <div class="small">
      18+ content may be included depending on platform guidelines.
    </div>

  </div>

</body>
</html>
