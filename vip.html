<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIP Access</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom, #cbb6ff, #a99bff);
      color: white;
      text-align: center;
      padding: 30px;
    }

    .card {
      max-width: 420px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 18px;
      padding: 35px 25px;
      box-shadow: 0 0 25px rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #bca7ff;
    }

    p {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .btn {
      display: block;
      background: #6f5bff;
      color: white;
      text-decoration: none;
      padding: 18px;
      border-radius: 12px;
      font-weight: bold;
      margin-bottom: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      transition: 0.2s;
      text-shadow:
        -1px -1px 0 #3a2fb0,
         1px -1px 0 #3a2fb0,
        -1px  1px 0 #3a2fb0,
         1px  1px 0 #3a2fb0;
    }

    .btn:hover {
      transform: translateY(2px);
      background: #7e6cff;
    }

    .small {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>VIP Access ✦</h1>

    <p>
      Exclusive content and behind-the-scenes peeks you won't find anywhere else
    </p>

    <a class="btn" href="https://fansly.com/nek0_wave" target="_blank">
      Enter VIP
    </a>

    <a class="btn" href="https://t.me/nek0s_channel" target="_blank">
      Telegram
    </a>

    <a class="btn" href="index.html">
      ← Back to Main Page
    </a>

    <div class="small">
      18+ users only.
    </div>
  </div>

</body>
</html>
