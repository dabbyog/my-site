<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Area</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      color: white;

      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.25), transparent 40%),
        radial-gradient(circle at 80% 30%, rgba(180,160,255,0.25), transparent 45%),
        linear-gradient(180deg, #d8ccff 0%, #9f8bff 45%, #4b3fa8 100%);

      opacity: 0;
      animation: pageLoad 0.6s ease forwards;
    }

    @keyframes pageLoad {
      to { opacity: 1; }
    }

    .nebula {
      position: fixed;
      inset: 0;
      opacity: 0.5;
      filter: blur(45px);
      z-index: 0;
      pointer-events: none;
    }

    .nebula::before,
    .nebula::after {
      content: "";
      position: absolute;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(255,255,255,0.2), transparent 60%);
      animation: drift 20s ease-in-out infinite;
    }

    .nebula::after {
      right: -25%;
      top: 25%;
      background: radial-gradient(circle, rgba(170,140,255,0.2), transparent 60%);
      animation-duration: 28s;
    }

    @keyframes drift {
      0%,100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(35px) translateX(-25px); }
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .stars span {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: float 18s linear infinite;
    }

    .stars span:nth-child(1)  { left: 6%;  animation-delay: 0s;   animation-duration: 14s; }
    .stars span:nth-child(2)  { left: 14%; animation-delay: 3s;   animation-duration: 18s; }
    .stars span:nth-child(3)  { left: 22%; animation-delay: 1s;   animation-duration: 16s; }
    .stars span:nth-child(4)  { left: 30%; animation-delay: 5s;   animation-duration: 22s; }
    .stars span:nth-child(5)  { left: 38%; animation-delay: 2s;   animation-duration: 19s; }
    .stars span:nth-child(6)  { left: 46%; animation-delay: 6s;   animation-duration: 15s; }
    .stars span:nth-child(7)  { left: 54%; animation-delay: 1.5s; animation-duration: 21s; }
    .stars span:nth-child(8)  { left: 62%; animation-delay: 4s;   animation-duration: 17s; }
    .stars span:nth-child(9)  { left: 70%; animation-delay: 2.5s; animation-duration: 20s; }
    .stars span:nth-child(10) { left: 78%; animation-delay: 0.5s; animation-duration: 16s; }
    .stars span:nth-child(11) { left: 86%; animation-delay: 3.5s; animation-duration: 23s; }
    .stars span:nth-child(12) { left: 92%; animation-delay: 1s;   animation-duration: 18s; }

    @keyframes float {
      0% { transform: translateY(110vh); opacity: 0; }
      10% { opacity: 0.6; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    .city {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 140px;
      z-index: 1;
      pointer-events: none;

      background:
        linear-gradient(to top, rgba(0,0,0,0.35), transparent 70%),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.05) 0px,
          rgba(255,255,255,0.05) 2px,
          transparent 2px,
          transparent 8px
        );

      opacity: 0.35;
      animation: cityGlow 6s ease-in-out infinite;
    }

    @keyframes cityGlow {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.4; }
    }

    .card {
      position: relative;
      z-index: 2;
      max-width: 420px;
      width: 100%;

      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 28px 22px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 0.95rem;
      opacity: 0.85;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .btn {
      display: block;
      text-decoration: none;
      color: white;
      background: rgba(120, 105, 255, 0.85);
      padding: 16px;
      border-radius: 12px;
      margin: 12px 0;
      font-size: 1.05rem;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 0 14px rgba(140,120,255,0.25);
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(1px);
      background: rgba(135, 120, 255, 0.95);
      box-shadow: 0 0 20px rgba(180,160,255,0.35);
    }

    .small {
      font-size: 0.75rem;
      opacity: 0.6;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="nebula"></div>

  <div class="stars">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="city"></div>

  <div class="card">

    <div class="divider">✦ ✧ ✦</div>

    <p></p>

    <a class="btn" href="https://fansly.com/nek0_wave" target="_blank">Continue</a>
    <a class="btn" href="https://t.me/nek0s_channel" target="_blank">Telegram Channel</a>
    <a class="btn" href="https://www.instagram.com/nek0_wave/" target="_blank">Spicy Instagram</a>
    <a class="btn" href="index.html" target="_blank">Back to Home</a>

    <div class="small">
      <div class="divider">✦ ✧ ✦</div>
    </div>

  </div>

</body>
</html>
