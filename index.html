<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dabby_OG</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #dcc8ff, #b9a7ff);
      padding: 40px 20px;
      text-align: center;
      color: white;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    /* PROFILE PIC */
    .profile-pic {
      width: 135px;
      height: 135px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #7a66ff;
      box-shadow: 0 0 25px rgba(122, 102, 255, 0.55);
      margin-bottom: 12px;
      background: rgba(255,255,255,0.2);
    }

    h1 {
      font-size: 2.3rem;
      text-shadow: 0 0 12px #9b8cff;
      margin-bottom: 5px;
    }

    .sparkles {
      letter-spacing: 8px;
      margin-bottom: 22px;
      opacity: 0.95;
    }

    /* BUTTONS */
    .btn {
      display: block;
      background: #6f5bff;
      color: white;
      text-decoration: none;
      padding: 18px 20px;
      border-radius: 14px;
      margin: 14px 0;
      font-weight: bold;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(2px);
      background: #7f6dff;
    }

    .subtitle {
      display: block;
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 5px;
    }

    .spacer {
      height: 35px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- PROFILE PICTURE (YOUR FILE NAME) -->
    <img src="InShot_20260531_070047679.jpg" class="profile-pic" />

    <h1>Dabby_OG</h1>
    <div class="sparkles">✦ ✦ ✦</div>

    <!-- LINKS -->

    <a class="btn" href="https://twitch.tv/dabby_og">
      Twitch
      <span class="subtitle">Mon, Tues, + Thurs</span>
    </a>

    <a class="btn" href="https://youtube.com/@dabby_og">
      YouTube
    </a>

    <a class="btn" href="vip.html">
      VIP
    </a>

    <a class="btn" href="https://www.facebook.com/share/18t9AzoCmV/">
      Facebook
    </a>

    <div class="spacer"></div>

  </div>

</body>
</html>
