<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dabby_OG</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to bottom, #d9c6ff, #c2b0ff);
      color: #1d2150;
      min-height: 100vh;
      padding: 40px 20px;
      font-family: 'Orbitron', sans-serif;
    }

    .container {
      max-width: 500px;
      margin: auto;
      text-align: center;
    }

    .profile-pic {
      width: 160px; /* slightly bigger */
      height: 160px;
      border-radius: 50%;
      border: 4px solid #6f5bff;
      object-fit: cover;
      display: block;
      margin: 0 auto 25px auto;
      background: #ffffff33;
      box-shadow: 0 0 25px #9b8cff55;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 18px;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 10px #8f7cff;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin-bottom: 35px;
      font-size: 2rem;
    }

    .socials a {
      color: #ffffff;
      transition: 0.2s;
    }

    .socials a:hover {
      transform: scale(1.12);
    }

    .link-card {
      display: block;
      background: #6f5bff;
      color: white;
      text-decoration: none;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 1.15rem;
      font-weight: bold;

      /* soft shadow */
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);

      transition: 0.2s;

      /* text outline effect */
      text-shadow:
        -1px -1px 0 #3a2fb0,
         1px -1px 0 #3a2fb0,
        -1px  1px 0 #3a2fb0,
         1px  1px 0 #3a2fb0;
    }

    .link-card:hover {
      transform: translateY(2px);
      background: #7e6cff;
    }

    .subtitle {
      display: block;
      font-size: 0.85rem;
      font-weight: normal;
      opacity: 0.9;
      margin-top: 6px;
      color: #f3efff;
    }
  </style>

  <script src="https://kit.fontawesome.com/a2d9d5a64f.js" crossorigin="anonymous"></script>
</head>

<body>
  <div class="container">

    <img src="profile.jpg" alt="Profile" class="profile-pic" />

    <h1>Dabby_OG</h1>

    <div class="socials">
      <a href="https://instagram.com/YOURUSERNAME" target="_blank">
        <i class="fab fa-instagram"></i>
      </a>

      <a href="https://tiktok.com/@YOURUSERNAME" target="_blank">
        <i class="fab fa-tiktok"></i>
      </a>
    </div>

    <a class="link-card" href="https://twitch.tv/dabby_og" target="_blank">
      Twitch
      <span class="subtitle">Mon, Tues, + Wed</span>
    </a>

    <a class="link-card" href="https://youtube.com/@dabby_og" target="_blank">
      YouTube
    </a>

    <a class="link-card" href="vip.html">
      VIP
    </a>

    <a class="link-card" href="https://www.facebook.com/share/18t9AzoCmV/" target="_blank">
      Facebook
    </a>

  </div>
</body>
</html>
