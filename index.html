<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dabby_OG</title>

  <!-- clean futuristic font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: white;
      text-align: center;
      padding: 40px 20px;
      position: relative;

      /* pastel cyber sky */
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.35), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(200,180,255,0.35), transparent 45%),
        linear-gradient(180deg, #d8ccff 0%, #9f8bff 40%, #4b3fa8 100%);
    }

    /* 🌫 nebula clouds */
    .nebula {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.55;
      filter: blur(40px);
    }

    .nebula::before,
    .nebula::after {
      content: "";
      position: absolute;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(255,255,255,0.25), transparent 60%);
      animation: drift 18s ease-in-out infinite;
    }

    .nebula::after {
      right: -20%;
      top: 20%;
      background: radial-gradient(circle, rgba(170,140,255,0.25), transparent 60%);
      animation-duration: 26s;
    }

    @keyframes drift {
      0%,100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(40px) translateX(-30px); }
    }

    /* ⭐ stars (very subtle now) */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .stars span {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.4;
      animation: float 22s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(100vh); opacity: 0; }
      20% { opacity: 0.6; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 520px;
      margin: auto;
    }

    .profile-pic {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow:
        0 0 18px rgba(255,255,255,0.25),
        0 0 50px rgba(160,140,255,0.45);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .role {
      font-size: 0.95rem;
      opacity: 0.8;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .divider {
      margin: 10px 0 26px;
      opacity: 0.6;
      letter-spacing: 8px;
    }

    .btn {
      position: relative;
      display: block;
      text-decoration: none;
      color: white;

      background: rgba(120, 105, 255, 0.85);
      padding: 16px;
      border-radius: 12px;
      margin: 12px 0;

      font-size: 1.05rem;
      font-weight: 500;

      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 0 14px rgba(140,120,255,0.25);

      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(1px);
      box-shadow: 0 0 20px rgba(180,160,255,0.35);
      background: rgba(135, 120, 255, 0.95);
    }

    .subtitle {
      display: block;
      font-size: 0.78rem;
      opacity: 0.85;
      margin-top: 4px;
    }
  </style>
</head>

<body>

  <div class="nebula"></div>

  <div class="stars">
    <span style="left:10%; animation-delay:0s;"></span>
    <span style="left:25%; animation-delay:3s;"></span>
    <span style="left:40%; animation-delay:1s;"></span>
    <span style="left:55%; animation-delay:5s;"></span>
    <span style="left:70%; animation-delay:2s;"></span>
    <span style="left:85%; animation-delay:4s;"></span>
  </div>

  </div>
